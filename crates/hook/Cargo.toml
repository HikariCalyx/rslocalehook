[package]
name = "rslocalehook-hook"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Injected DLL that emulates an ANSI code page, locale and time zone"

[lib]
name = "rslocalehook_hook"
crate-type = ["cdylib"]

[dependencies]
rslocalehook-common.workspace = true
retour.workspace = true

[dependencies.windows-sys]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_Controls",
    "Win32_UI_Input_Ime",
    "Win32_UI_WindowsAndMessaging",
]
