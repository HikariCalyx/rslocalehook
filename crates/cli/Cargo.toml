[package]
name = "rslocalehook"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Run a program under an emulated system locale, code page and time zone"

[[bin]]
name = "rslocalehook"
path = "src/main.rs"

[dependencies]
rslocalehook-common.workspace = true
anyhow.workspace = true
clap.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock"] }
chrono-tz = "0.10"

[dependencies.windows-sys]
workspace = true
features = [
    "Win32_Globalization",
    "Win32_System_Console",
    "Win32_UI_WindowsAndMessaging",
]
